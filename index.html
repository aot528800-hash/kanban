<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src https://api.github.com https://raw.githubusercontent.com; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<title>班委工作看板</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#0058A3; --blue-d:#003E70; --blue-l:#E8F0FA;
  --yellow:#FFDB00; --yellow-d:#E5C500;
  --bg:#F5F5F0; --surface:#fff; --text:#111; --text2:#484848; --text3:#767676;
  --border:#DFDFDF; --border-l:#EDEDED;
  --ok:#0A8A00; --ok-bg:#E8F5E8;
  --warn:#E86A00; --warn-bg:#FFF3E6;
  --err:#E00751; --err-bg:#FDE8EE;
  --purple:#7B2FBE; --purple-bg:#F3E8FF;
  --r:12px; --shadow:0 1px 3px rgba(0,0,0,.08),0 4px 12px rgba(0,0,0,.05);
}
html,body{background:var(--bg);color:var(--text);font-size:15px;line-height:1.55;
  font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
h1,h2,h3{font-weight:700;letter-spacing:-.01em}
input,select,textarea{font:inherit}

/* ===== Gate ===== */
#gate{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  background:var(--blue)}
.gate-box{width:380px;background:#fff;border-radius:20px;padding:40px 36px;text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.2)}
.gate-logo{width:64px;height:64px;margin:0 auto 20px;border-radius:18px;background:var(--yellow);
  display:flex;align-items:center;justify-content:center}
.gate-logo svg{width:32px;height:32px;fill:var(--blue)}
.gate-box h1{font-size:24px;margin-bottom:6px}
.gate-box p{color:var(--text3);font-size:14px;margin-bottom:24px}
.gate-box input{width:100%;padding:14px 18px;border-radius:12px;border:2px solid var(--border);
  font-size:17px;text-align:center;letter-spacing:3px;outline:none;transition:.2s}
.gate-box input:focus{border-color:var(--blue)}
.gate-box .btn-main{width:100%;margin-top:16px;padding:14px;border-radius:12px;
  background:var(--blue);color:#fff;font-size:17px;font-weight:700;transition:.15s}
.gate-box .btn-main:hover{background:var(--blue-d)}
.gate-box .btn-main:active{transform:scale(.98)}
.gate-err{color:var(--err);font-size:13px;margin-top:12px;min-height:20px}

/* ===== Header ===== */
header{position:sticky;top:0;z-index:30;height:60px;display:flex;align-items:center;gap:16px;
  padding:0 28px;background:var(--surface);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700;white-space:nowrap}
.brand-icon{width:32px;height:32px;border-radius:10px;background:var(--yellow);
  display:flex;align-items:center;justify-content:center}
.brand-icon svg{width:18px;height:18px;fill:var(--blue)}
.seg{display:flex;gap:4px;background:#F0F0EC;padding:4px;border-radius:12px}
.seg button{padding:8px 20px;border-radius:9px;font-size:14px;font-weight:600;color:var(--text2);transition:.15s}
.seg button:hover{background:#E8E8E2}
.seg button.on{background:var(--blue);color:#fff}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.who{font-size:13px;color:var(--text2);display:flex;align-items:center;gap:8px}
.who b{color:var(--text)}
.btn-sm{padding:8px 16px;border-radius:9px;font-size:13px;font-weight:600;transition:.15s}
.btn-sm.outline{border:2px solid var(--border);color:var(--text2)}
.btn-sm.outline:hover{border-color:var(--blue);color:var(--blue)}
.btn-sm.filled{background:var(--blue);color:#fff}
.btn-sm.filled:hover{background:var(--blue-d)}
.btn-sm.yellow{background:var(--yellow);color:var(--blue)}
.btn-sm.yellow:hover{background:var(--yellow-d)}

/* ===== Layout ===== */
main{max-width:1440px;margin:0 auto;padding:28px 32px 80px}
@media(max-width:800px){main{padding:20px 16px 60px}}
.page-head{margin-bottom:24px}
.page-head h1{font-size:32px;margin-bottom:4px}
.page-head p{color:var(--text3);font-size:14px}
.card{background:var(--surface);border-radius:var(--r);padding:24px;box-shadow:var(--shadow)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1000px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.g2,.g3,.g4{grid-template-columns:1fr}}

/* ===== Stats ===== */
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
@media(max-width:700px){.stat-row{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--surface);border-radius:var(--r);padding:18px 22px;box-shadow:var(--shadow)}
.stat .k{font-size:13px;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.stat .v{font-size:36px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
.stat .v.blue{color:var(--blue)} .stat .v.green{color:var(--ok)} .stat .v.orange{color:var(--warn)}

/* ===== Task Card ===== */
.task{background:var(--surface);border-radius:var(--r);padding:20px 22px;box-shadow:var(--shadow);
  margin-bottom:14px;border-left:5px solid var(--border);transition:.15s}
.task:hover{box-shadow:0 4px 16px rgba(0,0,0,.1)}
.task.p-高{border-left-color:var(--err)}
.task.p-中{border-left-color:var(--warn)}
.task.p-低{border-left-color:var(--ok)}
.task.st-done{opacity:.6;border-left-color:var(--ok)}
.task h3{font-size:17px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.task .meta{display:flex;flex-wrap:wrap;gap:10px;font-size:13px;color:var(--text3);align-items:center}
.task .meta b{color:var(--text2)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;
  padding:3px 10px;border-radius:20px;white-space:nowrap}
.pill.blue{background:var(--blue-l);color:var(--blue)}
.pill.yellow{background:#FFF8DC;color:#8B7500}
.pill.green{background:var(--ok-bg);color:var(--ok)}
.pill.orange{background:var(--warn-bg);color:var(--warn)}
.pill.red{background:var(--err-bg);color:var(--err)}
.pill.gray{background:#F0F0EC;color:var(--text3)}
.due-soon{color:var(--err);font-weight:700}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.submit-alert{margin-top:10px;padding:12px 16px;background:linear-gradient(135deg,#FFF3E0,#FFE0CC);
  border-radius:12px;border-left:4px solid var(--warn);font-size:13.5px;color:#8B4513;
  display:flex;align-items:center;gap:10px;animation:pulse 2s infinite}
.submit-alert .icon{font-size:22px;flex:none}

/* ===== Progress Controls ===== */
.progress-bar{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;align-items:center}
.pbtn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:10px;
  font-size:14px;font-weight:600;transition:.15s;border:2px solid transparent}
.pbtn:hover{transform:translateY(-1px)}
.pbtn:active{transform:scale(.97)}
.pbtn.todo{background:#F0F0EC;color:var(--text2)}
.pbtn.todo:hover{background:#E8E8E2}
.pbtn.doing{background:var(--blue);color:#fff}
.pbtn.done{background:var(--ok);color:#fff}
.pbtn.submit{background:var(--yellow);color:var(--blue)}
.pbtn.undo{background:none;color:var(--text3);border-color:var(--border);padding:9px 14px}
.pbtn.undo:hover{border-color:var(--err);color:var(--err)}
.pbtn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.progress-info{margin-top:10px;font-size:13px;color:var(--text3);display:flex;align-items:center;gap:6px}
.progress-info .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.progress-info .dot.doing{background:var(--blue)}
.progress-info .dot.done{background:var(--ok)}
.progress-info .dot.sub{background:var(--yellow)}

/* ===== Kanban ===== */
.kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:900px){.kanban{grid-template-columns:1fr}}
.kcol{background:#EDEDE8;border-radius:16px;padding:16px;min-height:200px}
.kcol h3{font-size:15px;margin-bottom:12px;padding:0 4px;display:flex;justify-content:space-between;align-items:center}
.kcol h3 .count{background:var(--surface);padding:2px 10px;border-radius:12px;font-size:13px;font-weight:700}
.kcol .task{margin-bottom:12px}

/* ===== Calendar ===== */
.cal{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:32px;overflow-x:auto}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.cal-head h2{font-size:28px}
.cal-nav{display:flex;gap:10px}
.cal-nav button{width:48px;height:48px;border-radius:14px;background:#F0F0EC;font-size:24px;
  display:flex;align-items:center;justify-content:center;transition:.15s}
.cal-nav button:hover{background:var(--blue);color:#fff}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(120px,1fr));gap:0;min-width:900px}
.cal-dow{text-align:center;font-size:15px;font-weight:700;color:var(--text3);padding:12px 4px}
.cal-day{min-height:130px;padding:8px 4px;background:#FAFAF6;
  border:1px solid var(--border);cursor:pointer;transition:.15s;position:relative}
.cal-day:hover{background:#F0F5EF}
.cal-day.out{opacity:.25;cursor:default}
.cal-day.out:hover{background:#FAFAF6}
.cal-day.today{background:var(--blue-l);box-shadow:inset 0 0 0 2px var(--blue)}
.cal-day .dn{font-size:15px;color:var(--text3);font-weight:700;margin-bottom:6px;padding-left:4px}
.cal-day .dn.today-num{color:var(--blue);font-weight:900;font-size:19px}
.cal-bar{font-size:12px;font-weight:600;padding:5px 8px;margin-bottom:2px;
  color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;
  transition:.12s;position:relative;z-index:1}
.cal-bar:hover{opacity:.88;transform:scale(1.01);z-index:2}
.cal-bar.s-start{border-radius:6px 0 0 6px}
.cal-bar.s-mid{border-radius:0}
.cal-bar.s-end{border-radius:0 6px 6px 0}
.cal-bar.s-single{border-radius:6px}

/* ===== Detail Modal ===== */
#detail{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:20px}
#detail.on{display:flex}
.dbox{background:#fff;border-radius:20px;width:min(600px,95vw);max-height:85vh;overflow:auto;padding:32px}
.dbox h2{font-size:22px;margin-bottom:16px}
.dclose{float:right;width:36px;height:36px;border-radius:10px;background:#F0F0EC;
  display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--text3)}
.dclose:hover{background:var(--err-bg);color:var(--err)}
.dfield{margin:14px 0}
.dfield .dk{font-size:12px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.dfield .dv{font-size:15px;line-height:1.7;white-space:pre-wrap}
.dfield .dv a.extlink{color:var(--blue);text-decoration:underline;font-weight:700;word-break:break-all}
.dfield .dv a.extlink:hover{color:var(--blue-d)}
.viewonly{margin-top:16px;padding:12px 16px;background:#F0F0EC;border-radius:10px;
  font-size:13px;color:var(--text3);text-align:center}
/* 辅导员联系栏 */
.counselor-bar{background:linear-gradient(135deg,#0058A3,#003E70);color:#fff;padding:16px 32px;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;border-radius:16px;margin-bottom:24px}
.counselor-bar .icon{font-size:24px;flex:none}
.counselor-bar .info{font-size:14px;line-height:1.7}
.counselor-bar .info b{font-size:16px}
.counselor-bar a{color:#FFDB00;text-decoration:none;font-weight:600}

/* ===== Empty ===== */
.empty{color:var(--text3);text-align:center;padding:40px;font-size:14px}

/* ===== 表格（总看板） ===== */
.tablecard{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:760px}
thead th{background:#F6F8F3;color:var(--text2);font-weight:700;font-size:13px;
  text-align:left;padding:14px 16px;white-space:nowrap;
  border-bottom:1px solid var(--border);letter-spacing:.02em}
tbody td{padding:14px 16px;border-bottom:1px solid var(--border-l);
  vertical-align:middle;white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
tbody tr:nth-child(even){background:#FBFCFA}
tbody tr:hover{background:#F2F6EF}
td.numcell,th.numcell{text-align:center;font-variant-numeric:tabular-nums;width:76px}
td.namecell{font-weight:700;color:var(--text)}
td.sidcell{font-variant-numeric:tabular-nums;color:var(--text2);letter-spacing:.01em}
td.telcell a{color:var(--blue);text-decoration:none;font-weight:600;
  font-variant-numeric:tabular-nums;padding:2px 0}
td.telcell a:hover{text-decoration:underline}
.rate-wrap{display:flex;align-items:center;gap:10px}
.rate-bar{background:#EDEDE8;border-radius:6px;height:8px;width:88px;overflow:hidden;flex:none}
.rate-bar>i{display:block;height:100%;background:var(--ok);border-radius:6px}
.rate-num{font-size:13px;color:var(--text3);font-variant-numeric:tabular-nums;
  min-width:42px;text-align:right}

/* ===== Print ===== */
.print-bar{display:none}
@media print{
  header,.seg,.hdr-right,.progress-bar,.pbtn,.cal-nav,.dclose,.print-bar,#gate,#detail{display:none!important}
  body{background:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  main{max-width:none;padding:0}
  .card,.task,.stat,.cal,.kcol{box-shadow:none!important;border:1px solid #ccc!important;break-inside:avoid}
  .task{margin-bottom:8px;padding:12px 16px}
  .page-head h1{font-size:20px}
  .stat .v{font-size:24px}
  .kanban{gap:8px}
  .cal-day{min-height:50px}
}
</style>
</head>

<script>
"use strict";
let DATA=null,ME=null,SHARED={};
const VALID_P=['todo','doing','done'];
const SAVE_Q={busy:false,dirty:false,fails:0};
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const today=()=>{const d=new Date();return`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;};
const pad=n=>String(n).padStart(2,'0');
const daysLeft=d=>{if(!d)return null;const a=new Date(d+'T00:00:00'),b=new Date(today()+'T00:00:00');return Math.round((a-b)/86400000);};
const dateRange=(s,e)=>{
  const raw=s||e; if(!raw)return[];
  const a=new Date((s||e)+'T00:00:00'), b=new Date((e||s)+'T00:00:00');
  if(isNaN(a)||isNaN(b))return[raw];
  if(a>b)return[s||e];
  // 防止误填超长区间导致日历渲染卡死
  if((b-a)/86400000>400){console.warn('[KANBAN] 任务时间跨度过大，已忽略:',s,e);return[s||e];}
  const out=[]; for(let d=new Date(a);d<=b;d.setDate(d.getDate()+1))
    out.push(`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`);
  return out;
};

/* ===== Toast ===== */
function toast(msg,color){
  let el=document.getElementById('toast');
  if(!el){
    el=document.createElement('div');el.id='toast';
    el.style.cssText='position:fixed;bottom:40px;left:50%;transform:translateX(-50%);z-index:999;'+
      'padding:16px 32px;border-radius:16px;font-size:17px;font-weight:700;'+
      'box-shadow:0 12px 40px rgba(0,0,0,.25);transition:.3s;opacity:0;pointer-events:none;'+
      'color:#fff;background:'+(color||'#111');
    document.body.appendChild(el);
  }
  el.style.background=color||'#111';
  el.textContent=msg;el.style.opacity='1';el.style.transform='translateX(-50%) scale(1)';
  clearTimeout(el._t);el._t=setTimeout(()=>{el.style.opacity='0';},2500);
  console.log('[KANBAN]',msg);
}

/* ===== 解密 ===== */
async function unlock(pwd){
  const enc=new TextEncoder(),B=window.__BLOB__;
  if(!B||!Array.isArray(B.slots)||!B.slots.length)throw new Error('bad');
  if(!(B.iter>=100000))throw new Error('bad'); // 拒绝被篡改降级的迭代次数
  const km=await crypto.subtle.importKey('raw',enc.encode(pwd),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64d(B.salt),iterations:B.iter,hash:'SHA-256'},
    km,{name:'AES-GCM',length:256},false,['decrypt']);
  const A_AD=enc.encode('kanban-data-v1'),A_TK=enc.encode('kanban-pat-v1');
  for(const s of B.slots){
    try{
      // AAD 绑定账号ID：篡改 slot 的 id 会导致认证失败，防止身份冒充
      const rawK=await crypto.subtle.decrypt(
        {name:'AES-GCM',iv:b64d(s.iv),additionalData:enc.encode('kanban-slot-v1|'+s.id)},
        key,b64d(s.ct));
      const k=await crypto.subtle.importKey('raw',rawK,'AES-GCM',false,['decrypt']);
      const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(B.iv),additionalData:A_AD},k,b64d(B.ct));
      let tok=null;
      if(B.tokCt){try{const tp=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(B.tokIv),additionalData:A_TK},k,b64d(B.tokCt));tok=JSON.parse(new TextDecoder().decode(tp)).token;}catch(e){}}
      return{me:s.id,data:JSON.parse(new TextDecoder().decode(pt)),token:tok,
             repo:B.repo,stateRepo:B.stateRepo||'aot528800-hash/kanban-state'};
    }catch(e){}
  }
  throw new Error('bad');
}

// 把文本里的网址变成可点击链接：先转义再链接化，避免 XSS
function linkify(s){
  const e=esc(s);
  return e.replace(/(https?:\/\/[^\s<"'）)]+)/g,
    u=>'<a href="'+u+'" target="_blank" rel="noopener noreferrer" class="extlink">'+u+'</a>');
}
/* ===== 共享状态 ===== */
const BADKEY=k=>k==='__proto__'||k==='constructor'||k==='prototype';
async function loadShared(){
  let ok=false;
  try{
    const repo=stateRepo();
    const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),8000);
    const r=await fetch('https://raw.githubusercontent.com/'+repo+'/main/state.json?t='+Date.now(),
      {signal:ctl.signal,cache:'no-store'});
    clearTimeout(tm);
    if(r.ok){SHARED=await r.json();ok=true;}else SHARED={};
  }catch(e){SHARED={};}
  // 清洗：结构归零 / 状态白名单 / 阻断原型污染
  if(!SHARED||typeof SHARED!=='object')SHARED={};
  for(const pid of Object.keys(SHARED)){
    if(BADKEY(pid)){delete SHARED[pid];continue;}
    if(typeof SHARED[pid]!=='object'||SHARED[pid]===null){SHARED[pid]={};continue;}
    for(const tid of Object.keys(SHARED[pid])){
      if(BADKEY(tid)){delete SHARED[pid][tid];continue;}
      const v=SHARED[pid][tid];
      if(typeof v==='string'){
        SHARED[pid][tid]={p:v==='done'?'done':v==='doing'?'doing':'todo',s:v==='submitted'};
      }else if(!v||typeof v!=='object'){
        SHARED[pid][tid]={p:'todo',s:false};
      }else{
        if(!VALID_P.includes(v.p))v.p='todo';
        v.s=!!v.s;
      }
    }
  }
  console.log('[KANBAN] shared state loaded, cleaned, ok='+ok);
  return ok;
}
async function saveShared(){
  if(!window.__TOKEN__)return false;
  const api='https://api.github.com/repos/'+stateRepo()+'/contents/state.json';
  const H={Authorization:'token '+window.__TOKEN__};
  const enc=obj=>{const b=new TextEncoder().encode(JSON.stringify(obj));let s='';for(let i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s);};
  const dec=str=>{const bin=atob(String(str||'').replace(/\s/g,''));const u=Uint8Array.from(bin,c=>c.charCodeAt(0));return JSON.parse(new TextDecoder().decode(u));};
  for(let attempt=0;attempt<4;attempt++){
    try{
      let sha=null,remote={};
      const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),12000);
      const r=await fetch(api+'?_='+Date.now()+'_'+attempt,{headers:H,signal:ctl.signal,cache:'no-store'});
      clearTimeout(tm);
      if(r.ok){
        const j=await r.json();
        sha=j.sha;
        try{remote=dec(j.content)||{};}catch(e){remote={};}
      }else if(r.status===401||r.status===403){
        console.error('[KANBAN] 云端写入权限失效 status='+r.status);
        return false; // 权限问题重试无用，立即失败
      }else if(r.status!==404){
        await new Promise(x=>setTimeout(x,300*(attempt+1)));continue;
      }
      if(!remote||typeof remote!=='object')remote={};
      const merged=Object.create(null);
      for(const k of Object.keys(remote))if(!BADKEY(k))merged[k]=remote[k];
      if(ME&&SHARED[ME]){
        // 按任务合并：远端别人/别的设备的新数据保留，本地自己的改动优先
        const base=(merged[ME]&&typeof merged[ME]==='object')?merged[ME]:{};
        merged[ME]=Object.assign({},base,SHARED[ME]);
      }else{
        for(const k of Object.keys(SHARED))if(!BADKEY(k)&&!merged[k])merged[k]=SHARED[k];
      }
      SHARED=merged;
      const body={message:'update state',content:enc(merged)};
      if(sha)body.sha=sha;
      const r2=await fetch(api,{method:'PUT',
        headers:Object.assign({},H,{'Content-Type':'application/json'}),
        body:JSON.stringify(body)});
      if(r2.ok)return true;
      // 409/422 = 有人抢先保存了，重新读再试
      if(r2.status===409||r2.status===422){
        await new Promise(x=>setTimeout(x,250*(attempt+1)));continue;
      }
      console.error('[KANBAN] 保存失败 status='+r2.status);
      return false;
    }catch(e){
      await new Promise(x=>setTimeout(x,300*(attempt+1)));
    }
  }
  return false;
}
// 串行队列：避免快速连点造成多次并发写、互相覆盖
function saveSharedQueued(){
  if(!window.__TOKEN__)return;
  if(SAVE_Q.busy){SAVE_Q.dirty=true;return;}
  SAVE_Q.busy=true;
  saveShared().then(ok=>{
    if(!ok){
      SAVE_Q.fails++;
      if(SAVE_Q.fails<=2)toast('⚠️ 进度未能保存到云端，正在重试','var(--err)');
      SAVE_Q.dirty=true;
    }else{SAVE_Q.fails=0;}
  }).catch(()=>{SAVE_Q.dirty=true;}).then(()=>{
    SAVE_Q.busy=false;
    if(SAVE_Q.dirty){SAVE_Q.dirty=false;setTimeout(saveSharedQueued,700);}
  });
}
function myState(tid){return stateOf(ME,tid);}
function setMyState(tid,progress,submitted){
  if(!ME){console.error('[KANBAN] ME is null');return;}
  if(!SHARED[ME])SHARED[ME]={};
  let cur=SHARED[ME][tid];
  if(!cur||typeof cur!=='object')cur={p:'todo',s:false};
  if(!VALID_P.includes(cur.p))cur.p='todo';
  if(progress!==undefined){
    if(!VALID_P.includes(progress)){console.error('[KANBAN] 非法状态',progress);return;}
    cur.p=progress;
  }
  if(submitted!==undefined){
    // 业务约束：未完成的任务不允许标记为「已提交辅导员」（撤销提交不受限）
    if(submitted===true&&cur.p!=='done'){
      toast('请先点「✓ 完成了」再提交辅导员','var(--err)');
      return;
    }
    cur.s=!!submitted;
  }
  SHARED[ME][tid]=cur;
  saveSharedQueued();
}
function sharedStats(tid,task){
  const assigned=assigneesOf(task);
  let done=0,doing=0,submitted=0;
  assigned.forEach(p=>{
    const ms=stateOf(p.id,tid);
    if(ms.s)submitted++;
    if(isFullyDoneOf(p.id,task))done++;
    else if(ms.p==='done'||ms.p==='doing')doing++;
  });
  return{done,doing,total:assigned.length,submitted};
}

/* ===== 工具 ===== */
function personOf(id){return(DATA.people||[]).find(p=>p.id===id);}
// 状态数据单独放在一个仓库：页面里的 PAT 只能写它，改不了 index.html
function stateRepo(){
  return window.__STATE_REPO__
    || (window.__BLOB__ && window.__BLOB__.stateRepo)
    || 'aot528800-hash/kanban-state';
}
function myRole(){const p=personOf(ME);return p?p.role:'';}
function isAdmin(){return myRole()==='辅导员';}
// 责任人集合：排除辅导员，包含总负责人；所有统计/分母统一走这里
function assigneesOf(t){
  const roles=(t&&t.roles)||[];
  return(DATA.people||[]).filter(p=>{
    if(p.role==='辅导员')return false; // 辅导员不进责任人分母
    if(t&&t.lead&&t.lead===p.id)return true;
    if(roles.includes('全体'))return true;
    return roles.includes(p.role);
  });
}
// 某人某任务的规范状态（非法值一律归一到 todo，避免出现「没有任何按钮」的死状态）
function stateOf(pid,tid){
  const s=SHARED[pid];
  if(!s||typeof s!=='object')return{p:'todo',s:false};
  const st=s[tid];
  if(!st||typeof st!=='object')return{p:'todo',s:false};
  return{p:VALID_P.includes(st.p)?st.p:'todo',s:!!st.s};
}
// 某人对某任务是否真正完成（需提交的任务必须既完成又提交）
function isFullyDoneOf(pid,t){
  const ms=stateOf(pid,t.id);
  if(ms.p!=='done')return false;
  if(t.needs_submit&&!ms.s)return false;
  return true;
}
function leadName(t){
  if(!t||!t.lead)return'';
  const p=personOf(t.lead);
  return p?(p.name?p.name+'（'+p.class+'·'+p.role+'）':t.lead):t.lead;
}
// 表格里用的短格式：姓名 · 班级（省掉岗位，避免列内文字过长）
function leadShort(t){
  if(!t||!t.lead)return'';
  const p=personOf(t.lead);
  if(!p)return t.lead;
  if(p.role==='辅导员')return p.name+'（辅导员）';
  return p.name+' · '+p.class;
}
// 辅导员联系方式从加密数据里取，模板不再硬编码任何真实手机号
function renderCounselor(){
  const c=(DATA&&DATA.counselor)||{};
  const bar=$('#counselor-bar');
  if(!bar)return;
  if(!c.name&&!c.phone){bar.hidden=true;return;}
  bar.hidden=false;
  bar.querySelector('.info').innerHTML='<b>辅导员：'+esc(c.name||'—')+'</b>'
    +(c.phone?'　电话/微信：<a href="tel:'+esc(c.phone)+'">'+esc(c.phone)+'</a>':'')
    +(c.office?'　办公地点：'+esc(c.office):'');
}
function roleLabel(t){
  if(t.lead) return t.lead;
  if(t.roles.includes('全体'))return'全体班委';
  return t.roles.map(r=>{
    const same=(DATA.people||[]).filter(p=>p.role===r);
    const names=same.filter(p=>p.name).map(p=>p.name);
    return names.length?`${r}（${names.join('、')}）`:r;
  }).join('、');
}
function isMine(t){
  if(isAdmin())return false; // 辅导员只看总看板，不领任务
  const roles=(t&&t.roles)||[];
  if(t&&t.lead&&t.lead===ME)return true;
  if(roles.includes('全体'))return true;
  return roles.includes(myRole());
}
function isFullyDone(t){return isFullyDoneOf(ME,t);}
function getProgress(t){
  const ms=myState(t.id);
  if(isFullyDone(t))return'done';
  if(ms.p==='done'||ms.p==='doing')return'doing';
  return'todo';
}

/* ===== 路由 ===== */
function show(v){
  if(v==='admin'&&!isAdmin()){toast('无权访问总看板','var(--err)');v='mine';}
  ['mine','all','cal','duty','admin'].forEach(x=>{const el=$('#v-'+x);if(el)el.hidden=x!==v;});
  $$('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.view===v));
  if(v==='mine')renderMine();
  if(v==='all')renderAll();
  if(v==='cal')renderCal();
  if(v==='duty')renderDuty();
  if(v==='admin'){
    // 每次进入总看板都重新拉一次最新进度，避免看到登录瞬间的旧快照
    loadShared().then(()=>{if(ME&&isAdmin())renderAdmin();});
    renderAdmin();
  }
  window.scrollTo(0,0);
}
$$('.seg button').forEach(b=>b.onclick=()=>show(b.dataset.view));

    window.__REPO__=r.repo||'aot528800-hash/kanban';

  const all=DATA.tasks;
  const mine=all.filter(isMine);
  const todo=mine.filter(t=>getProgress(t)==='todo');
  const doing=mine.filter(t=>getProgress(t)==='doing');
  const done=mine.filter(t=>isFullyDone(t));
  const submitted=mine.filter(t=>myState(t.id).s);
  const emptyMsg=isAdmin()?'辅导员不领任务，请点顶部「总看板」查看全体班委进度':'暂时没有分配给你岗位的任务';

  $('#v-mine').innerHTML=`
    <div class="page-head"><h1>我的任务</h1>
      <p>${(()=>{const p=personOf(ME);const parts=[];
        if(p&&p.name)parts.push(esc(p.name));
        if(p&&p.class)parts.push(esc(p.class));
        if(p&&p.role)parts.push('岗位「'+esc(p.role)+'」');
        if(p&&p.sid)parts.push('学号 '+esc(p.sid));
        if(p&&p.phone)parts.push('手机 '+esc(p.phone));
        parts.push('共 '+mine.length+' 项');
        return parts.join(' · ');})()}</p></div>
    <div class="stat-row">
      <div class="stat"><div class="k">待办</div><div class="v">${todo.length}</div></div>
      <div class="stat"><div class="k">进行中</div><div class="v blue">${doing.length}</div></div>
      <div class="stat"><div class="k">已完成</div><div class="v green">${done.length}</div></div>
      <div class="stat"><div class="k">已提交辅导员</div><div class="v orange">${submitted.length}</div></div>
    </div>
    ${mine.length?mine.map(t=>taskCard(t,true)).join(''):'<div class="card"><div class="empty">'+emptyMsg+'</div></div>'}`;
  bindCards();
}

function taskCard(t,showCtrl){
  const ms=myState(t.id);
  const sc=sharedStats(t.id,t);
  const d=daysLeft(t.due);
  const fullyDone=isFullyDone(t);
  const prog=getProgress(t);
  let dueH=t.due?esc(t.due):'未设';
  if(!fullyDone&&d!==null){
    if(d<0)dueH=`<span class="due-soon">已逾期 ${-d} 天</span>`;
    else if(d===0)dueH='<span class="due-soon">今天截止</span>';
    else if(d<=3)dueH=`<span class="due-soon">${dueH}（还剩 ${d} 天）</span>`;
  }
  let progressLabel;
  if(fullyDone)progressLabel='<span class="pill green">✓ 已完成</span>';
  else if(ms.p==='done'&&t.needs_submit&&!ms.s)progressLabel='<span class="pill" style="background:#FFE0D0;color:#C0392B;font-size:13px;font-weight:700;padding:5px 14px;animation:pulse 1.5s infinite">⚠️ 还差一步！点「提交辅导员」才算完成</span>';
  else if(ms.p==='doing')progressLabel='<span class="pill blue">进行中</span>';
  else progressLabel='<span class="pill gray">待办</span>';
  return`<div class="task p-${esc(t.priority||'低')} ${fullyDone?'st-done':''}" data-id="${esc(t.id)}">
    <h3>${esc(t.title)}</h3>
    <div class="meta">
      <span class="pill ${t.priority==='高'?'red':t.priority==='中'?'orange':'green'}">${esc(t.priority||'低')}</span>
      <span class="pill blue">${esc(t.dept||'—')}</span>
      ${progressLabel}
      ${t.needs_submit?'<span class="pill yellow">需提交辅导员</span>':''}
      <span>截止：${dueH}</span>
      <span>负责：<b>${esc(roleLabel(t))}</b></span>
    </div>
    ${t.learning?`<div style="margin-top:8px;font-size:12.5px;color:var(--text3);line-height:1.6">
      🌱 <b>做这件事能学到：</b>${esc(t.learning)}
    </div>`:''}
    ${sc.done+sc.doing>0?`<div class="progress-info">
      ${sc.doing?`<span class="dot doing"></span>${sc.doing} 人进行中`:''}
      ${sc.done?`<span class="dot done"></span>${sc.done}/${sc.total} 人已完成`:''}
    </div>`:''}
    ${ms.p==='done'&&t.needs_submit&&!ms.s?`<div class="submit-alert">
      <span class="icon">🔔</span>
      <span><b>还差最后一步！</b>把材料交给辅导员、当面确认收到后，点「<b>提交辅导员</b>」就算完成。</span>
    </div>`:''}
    ${showCtrl?`<div class="progress-bar">
      ${ms.p==='todo'?`<button class="pbtn doing" data-tid="${esc(t.id)}" data-act="start">▶ 开始做</button>`:''}
      ${ms.p==='doing'?`<button class="pbtn done" data-tid="${esc(t.id)}" data-act="finish">✓ 完成了</button>`:''}
      ${ms.p==='done'&&!fullyDone?`<button class="pbtn done" data-tid="${esc(t.id)}" data-act="finish">✓ 完成了</button>`:''}
      ${fullyDone?`<button class="pbtn done" disabled>✓ 已完成</button>`:''}
      ${(t.needs_submit&&(ms.p==='done'||ms.s))?`<button class="pbtn submit ${ms.s?'done':''}" data-tid="${esc(t.id)}" data-act="submit">${ms.s?'✓ 已提交辅导员':'提交辅导员'}</button>`:''}
      ${ms.p!=='todo'?`<button class="pbtn undo" data-tid="${esc(t.id)}" data-act="reset">撤销</button>`:''}
    </div>`:''}
  </div>`;
}

function bindCards(){
  $$('.task[data-id]').forEach(el=>{
    el.addEventListener('click',e=>{
      if(e.target.closest('.pbtn'))return;
      openDetail(el.dataset.id);
    });
  });
  $$('.pbtn[data-tid]').forEach(el=>{
    el.addEventListener('click',e=>{
      e.preventDefault();
      e.stopPropagation();
      try{
        const tid=el.dataset.tid,act=el.dataset.act;
        const ms=myState(tid);
        console.log('[KANBAN] click',act,'task',tid,'current',JSON.stringify(ms));
        if(act==='start'){
          setMyState(tid,'doing');
          el.textContent='✓ 完成了';
          el.className='pbtn done';
          el.dataset.act='finish'; // 立刻可点，不必等 600ms 重绘
          toast('▶ 已开始做','var(--blue)');
        }else if(act==='finish'){
          setMyState(tid,'done');
          el.textContent='✓ 已完成';
          el.className='pbtn done';
          el.disabled=true;
          toast('✓ 已标记完成','var(--ok)');
        }else if(act==='submit'){
          setMyState(tid,undefined,!ms.s);
          el.textContent=ms.s?'提交辅导员':'✓ 已提交辅导员';
          el.className='pbtn submit '+(ms.s?'':'done');
          toast(ms.s?'已取消提交':'✓ 已提交辅导员',ms.s?'#888':'var(--yellow)');
        }else if(act==='reset'){
          setMyState(tid,'todo',false);
          toast('已撤销','#888');
        }
        setTimeout(()=>{
          const active=$('.seg button.on');
          if(active)show(active.dataset.view);
        },600);
      }catch(err){
        console.error('[KANBAN] error',err);
        toast('操作失败: '+err.message,'var(--err)');
      }
    });
  });
}

/* ===== 全部任务 ===== */
function renderAll(){
  const cols=['待办','进行中','已完成'].map(st=>{
    const list=DATA.tasks.filter(t=>{
      const prog=getProgress(t);
      if(st==='已完成')return prog==='done';
      if(st==='进行中')return prog==='doing';
      return prog==='todo';
    });
    return`<div class="kcol"><h3>${st}<span class="count">${list.length}</span></h3>
      ${list.map(t=>taskCard(t,isMine(t))).join('')||'<div class="empty">无</div>'}</div>`;
  }).join('');
  $('#v-all').innerHTML=`<div class="page-head"><h1>全部任务</h1>
    <p>共 ${DATA.tasks.length} 项 · 按我的进度分列 · 所有班委可见</p></div>
    <div class="kanban">${cols}</div>`;
  bindCards();
}

/* 任务颜色：每个任务一个固定颜色 */
const TASK_COLORS=['#0058A3','#E86A00','#0A8A00','#E00751','#7B2FBE','#0097A7','#C2185B','#F57C00','#455A64','#388E3C'];
function taskColor(id){
  let hash=0;for(let i=0;i<id.length;i++){hash=((hash<<5)-hash)+id.charCodeAt(i);hash|=0;}
  return TASK_COLORS[Math.abs(hash)%TASK_COLORS.length];
}

/* ===== 总看板（管理员） ===== */
function renderAdmin(){
  const tasks=DATA.tasks||[];
  const people=DATA.people||[];
  
  // 统计（按全体责任人聚合，不是登录者自己的进度）
  const totalTasks=tasks.length;
  const taskStatus={待办:0,进行中:0,已完成:0};
  const assignCache={};
  tasks.forEach(t=>{assignCache[t.id]=assigneesOf(t);});
  const progOf=(pid,t)=>({
    full:isFullyDoneOf(pid,t),
    active:(()=>{const ms=stateOf(pid,t.id);return ms.p==='done'||ms.p==='doing';})(),
    pendingSubmit:(()=>{const ms=stateOf(pid,t.id);return ms.p==='done'&&!isFullyDoneOf(pid,t);})()
  });
  tasks.forEach(t=>{
    const as=assignCache[t.id];
    if(!as.length){taskStatus['待办']++;return;}
    const doneN=as.filter(p=>progOf(p.id,t).full).length;
    const actN=as.filter(p=>progOf(p.id,t).active).length;
    if(doneN===as.length)taskStatus['已完成']++;
    else if(doneN>0||actN>0)taskStatus['进行中']++;
    else taskStatus['待办']++;
  });

  // 每个任务的完成情况
  const taskProgress=tasks.map(t=>{
    const assigned=assignCache[t.id];
    const done=assigned.filter(p=>progOf(p.id,t).full).length;
    const doing=assigned.filter(p=>{const r=progOf(p.id,t);return !r.full&&r.active;}).length;
    const pending=assigned.filter(p=>progOf(p.id,t).pendingSubmit).length;
    return{task:t,assigned:assigned.length,done,doing,pending};
  });

  // 每个班委的任务情况
  const peopleProgress=people.filter(p=>p.role!=='辅导员').map(p=>{
    const myTasks=tasks.filter(t=>assignCache[t.id].some(a=>a.id===p.id));
    const done=myTasks.filter(t=>isFullyDoneOf(p.id,t)).length;
    const doing=myTasks.filter(t=>{const ms=stateOf(p.id,t.id);return !isFullyDoneOf(p.id,t)&&(ms.p==='done'||ms.p==='doing');}).length;
    return{person:p,total:myTasks.length,done,doing,todo:myTasks.length-done-doing};
  }).sort((a,b)=>a.done-b.done);

  $('#v-admin').innerHTML=`
    <div class="page-head"><h1>📊 总看板</h1>
      <p>辅导员视图 · 查看所有任务和班委进度 · 更新于 ${esc(DATA.updated)}</p></div>

    <div class="stat-row">
      <div class="stat"><div class="k">总任务数</div><div class="v">${totalTasks}</div></div>
      <div class="stat"><div class="k">待办</div><div class="v">${taskStatus.待办}</div></div>
      <div class="stat"><div class="k">进行中</div><div class="v blue">${taskStatus.进行中}</div></div>
      <div class="stat"><div class="k">已完成</div><div class="v green">${taskStatus.已完成}</div></div>
    </div>

    <div class="page-head" style="margin-top:24px"><h1 style="font-size:20px">任务进度总览</h1>
      <p>每个任务的完成情况</p></div>
    <div class="tablecard"><div class="table-wrap"><table>
      <thead><tr>
        <th>任务</th><th>优先级</th><th>截止</th><th>负责人</th>
        <th class="numcell">完成</th><th class="numcell">进行中</th><th class="numcell">待提交</th><th>进度</th>
      </tr></thead>
      <tbody>${taskProgress.map(x=>`
        <tr>
          <td style="font-weight:600;white-space:normal;max-width:300px;line-height:1.5">${esc(x.task.title)}</td>
          <td><span class="pill ${x.task.priority==='高'?'red':x.task.priority==='中'?'orange':'green'}">${esc(x.task.priority||'低')}</span></td>
          <td style="font-size:13px;color:var(--text3);font-variant-numeric:tabular-nums">${esc(x.task.due||'—')}</td>
          <td style="font-size:13px;color:var(--text2)">${esc(x.task.lead?leadShort(x.task):roleLabel(x.task))}</td>
          <td class="numcell" style="color:var(--ok);font-weight:700">${x.done}/${x.assigned}</td>
          <td class="numcell" style="color:var(--blue)">${x.doing}</td>
          <td class="numcell" style="color:${x.pending?'#C0392B':'var(--text3)'};font-weight:${x.pending?'700':'400'}">${x.pending}</td>
          <td>
            <div class="rate-wrap">
              <div class="rate-bar"><i style="width:${x.assigned?Math.round(x.done/x.assigned*100):0}%"></i></div>
              <span class="rate-num">${x.assigned?Math.round(x.done/x.assigned*100):0}%</span>
            </div>
          </td>
        </tr>`).join('')}
      </tbody>
    </table></div></div>

    <div class="page-head" style="margin-top:24px"><h1 style="font-size:20px">班委通讯录</h1>
      <p>点击电话可直接拨打 · 联系班委安排工作</p></div>
    <div class="tablecard"><div class="table-wrap"><table>

      </tr></thead>
      <tbody>${peopleProgress.map(x=>`
        <tr>

            <div class="rate-wrap">

            </div>
          </td>
        </tr>`).join('')}
      </tbody>
    </table></div></div>

    <div class="page-head" style="margin-top:24px"><h1 style="font-size:20px">按岗位统计</h1>
      <p>各岗位整体完成情况</p></div>
    <div class="grid g3">
      ${renderRoleCards(people,tasks)}
    </div>`;

function renderRoleCards(people,tasks){
  const roles={};
  people.forEach(p=>{
    if(p.role==='辅导员')return; // 辅导员不领任务，不计入岗位统计
    if(!roles[p.role])roles[p.role]={total:0,done:0,doing:0};
    const myTasks=tasks.filter(t=>{
      const rs=(t&&t.roles)||[];
      return (t&&t.lead&&t.lead===p.id)||rs.includes('全体')||rs.includes(p.role);
    });
    myTasks.forEach(t=>{
      roles[p.role].total++;
      if(isFullyDoneOf(p.id,t)){roles[p.role].done++;}
      else{const ms=stateOf(p.id,t.id);if(ms.p==='done'||ms.p==='doing')roles[p.role].doing++;}
    });
  });
  return Object.entries(roles).map(([role,stat])=>{
    const pct=stat.total?Math.round(stat.done/stat.total*100):0;
    return '<div class="card">'
      +'<h2 style="font-size:15px">'+esc(role)+'</h2>'
      +'<div style="display:flex;gap:16px;margin:10px 0">'
      +'<div><div style="font-size:24px;font-weight:700">'+stat.done+'</div><div style="font-size:12px;color:var(--text3)">已完成</div></div>'
      +'<div><div style="font-size:24px;font-weight:700;color:var(--blue)">'+stat.doing+'</div><div style="font-size:12px;color:var(--text3)">进行中</div></div>'
      +'<div><div style="font-size:24px;font-weight:700">'+stat.total+'</div><div style="font-size:12px;color:var(--text3)">总任务</div></div>'
      +'</div>'
      +'<div style="background:#EDEDE8;border-radius:6px;height:8px;overflow:hidden">'
      +'<div style="background:var(--ok);height:100%;width:'+pct+'%;border-radius:6px"></div>'
      +'</div>'
      +'</div>';
  }).join('');
}

/* ===== 日历（多天支持） ===== */
let CY=new Date().getFullYear(),CM=new Date().getMonth();
function renderCal(){
  const first=new Date(CY,CM,1);
  const startDow=(first.getDay()+6)%7;
  const daysIn=new Date(CY,CM+1,0).getDate();
  const cells=[];
  for(let i=0;i<startDow;i++)cells.push(null);
  for(let d=1;d<=daysIn;d++)cells.push(d);

  // 任务按日期展开
  const byDay={};
  DATA.tasks.forEach(t=>{
    const dates=dateRange(t.start,t.due);
    dates.forEach((dt,i)=>{
      if(!byDay[dt])byDay[dt]=[];
      const cls=i===0&&dates.length>1?'s-start':i===dates.length-1&&dates.length>1?'s-end':dates.length>1?'s-mid':'s-single';
      byDay[dt].push({t,span:cls});
    });
  });

  const html=cells.map(d=>{
    if(!d)return'<div class="cal-day out"></div>';
    const key=`${CY}-${pad(CM+1)}-${pad(d)}`;
    const list=byDay[key]||[];
    const isToday=key===today();
    return`<div class="cal-day ${isToday?'today':''}" data-day="${key}">
      <div class="dn ${isToday?'today-num':''}">${d}</div>
      ${list.slice(0,3).map(x=>`<div class="cal-bar ${x.span}" style="background:${taskColor(x.t.id)}" data-tid="${esc(x.t.id)}">${esc(x.t.title)}</div>`).join('')}
      ${list.length>3?`<div class="dn">+${list.length-3} 项</div>`:''}
    </div>`;
  }).join('');

  $('#v-cal').innerHTML=`
    <div class="page-head"><h1>日历</h1><p>按时间查看 · 多天任务显示为横条 · 点某天看当天任务</p></div>
    <div class="cal">
      <div class="cal-head"><h2>${CY} 年 ${CM+1} 月</h2>
        <div class="cal-nav"><button id="cal-prev">‹</button><button id="cal-next">›</button></div></div>
      <div class="cal-grid">${['一','二','三','四','五','六','日'].map(x=>`<div class="cal-dow">${x}</div>`).join('')}${html}</div>
    </div>`;
  $('#cal-prev').onclick=()=>{CM--;if(CM<0){CM=11;CY--;}renderCal();};
  $('#cal-next').onclick=()=>{CM++;if(CM>11){CM=0;CY++;}renderCal();};
  $$('.cal-day[data-day]').forEach(el=>el.onclick=e=>{
    if(e.target.classList.contains('cal-bar')){openDetail(e.target.dataset.tid);return;}
    openDay(el.dataset.day);
  });
  $$('.cal-bar[data-tid]').forEach(el=>el.onclick=e=>{e.stopPropagation();openDetail(el.dataset.tid);});
}

function openDay(key){
  const list=DATA.tasks.filter(t=>{
    const dates=dateRange(t.start,t.due);
    return dates.includes(key);
  });
  $('#dbox').innerHTML=`<button class="dclose" onclick="closeDetail()">×</button>
    <h2>${esc(key)}</h2>
    ${list.length?list.map(t=>{
      const ms=myState(t.id);
      let pl;
      if(isFullyDone(t))pl='已完成';
      else if(ms.p==='done'&&t.needs_submit&&!ms.s)pl='已完成·待提交';
      else if(ms.p==='doing')pl='进行中';
      else pl='待办';
      return`<div style="margin:12px 0;padding:16px;background:#FAFAF6;border-radius:12px">
      <div style="font-weight:700;margin-bottom:6px">${esc(t.title)}</div>
      <div style="font-size:13px;color:var(--text3)">${esc(t.dept)} · ${esc(pl)} · ${esc(roleLabel(t))}</div>
    </div>`;
    }).join(''):'<div class="empty">这一天没有任务</div>'}`;
  $('#detail').classList.add('on');
}

/* ===== 详情 ===== */
function openDetail(id){
  const t=DATA.tasks.find(x=>x.id===id);if(!t)return;
  const ms=myState(t.id),sc=sharedStats(t.id,t),d=daysLeft(t.due);
  const mine=isMine(t);
  const dueNote=(ms.p!=='done'&&d!==null)?(d<0?`（已逾期 ${-d} 天）`:d===0?'（今天截止）':`（还剩 ${d} 天）`):'';
  let progressLabel;
  if(isFullyDone(t))progressLabel='<span class="pill green">✓ 已完成</span>';
  else if(ms.p==='done'&&t.needs_submit&&!ms.s)progressLabel='<span class="pill orange">已完成·待提交</span>';
  else if(ms.p==='doing')progressLabel='<span class="pill blue">进行中</span>';
  else progressLabel='<span class="pill gray">待办</span>';
  $('#dbox').innerHTML=`
    <button class="dclose" onclick="closeDetail()">×</button>
    <h2>${esc(t.title)}</h2>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">
      <span class="pill ${t.priority==='高'?'red':t.priority==='中'?'orange':'green'}">${esc(t.priority)}</span>
      <span class="pill blue">${esc(t.dept)}</span>
      ${progressLabel}
      ${t.needs_submit?'<span class="pill yellow">需提交辅导员</span>':''}
    </div>
    <div class="dfield"><div class="dk">负责岗位</div><div class="dv">${esc(roleLabel(t))}</div></div>
    <div class="dfield"><div class="dk">时间</div><div class="dv">开始 ${esc(t.start||'—')}　截止 ${esc(t.due||'—')} ${esc(dueNote)}</div></div>
    ${t.detail?`<div class="dfield"><div class="dk">具体要求</div><div class="dv">${linkify(t.detail)}</div></div>`:''}
    ${t.deliverable?`<div class="dfield"><div class="dk">需要交什么</div><div class="dv">${linkify(t.deliverable)}</div></div>`:''}
    ${t.note?`<div class="dfield"><div class="dk">备注</div><div class="dv">${esc(t.note)}</div></div>`:''}
    ${t.learning?`<div style="margin-top:16px;padding:16px 20px;background:linear-gradient(135deg,#E8F0FA,#F0F5FF);border-radius:12px">
      <div style="font-size:14px;font-weight:700;color:#0058A3;margin-bottom:8px">🌱 做这件事你能学到什么</div>
      <div style="font-size:14px;line-height:1.8;color:var(--text2)">${esc(t.learning)}</div>
    </div>`:''}
    ${t.ai_tip?`<div style="margin-top:10px;padding:16px 20px;background:linear-gradient(135deg,#F0F5FF,#E8F0FA);border-radius:12px">
      <div style="font-size:14px;font-weight:700;color:#0058A3;margin-bottom:8px">🤖 用 AI 帮你提高效率</div>
      <div style="font-size:14px;line-height:1.8;color:var(--text2)">${esc(t.ai_tip)}</div>
    </div>`:''}
    ${t.lead?`<div style="margin-top:10px;padding:12px 16px;background:#F7F9F4;border-radius:10px;font-size:13px;color:var(--text2)">
      👤 <b>总负责人：</b>${esc(leadName(t))}
      　辅导员只联系这个人
    </div>`:''}
    ${sc.done+sc.doing>0?`<div class="dfield"><div class="dk">进度</div><div class="dv">
      ${sc.doing?`${sc.doing} 人进行中　`:''}${sc.done}/${sc.total} 人已完成</div></div>`:''}
    ${mine?`<div class="progress-bar" style="margin-top:18px">
      ${ms.p==='todo'?`<button class="pbtn doing" data-tid="${esc(t.id)}" data-act="start">▶ 开始做</button>`:''}
      ${ms.p==='doing'?`<button class="pbtn done" data-tid="${esc(t.id)}" data-act="finish">✓ 完成了</button>`:''}
      ${ms.p==='done'&&!isFullyDone(t)?`<button class="pbtn done" data-tid="${esc(t.id)}" data-act="finish">✓ 完成了</button>`:''}
      ${isFullyDone(t)?`<button class="pbtn done" disabled>✓ 已完成</button>`:''}
      ${(t.needs_submit&&(ms.p==='done'||ms.s))?`<button class="pbtn submit ${ms.s?'done':''}" data-tid="${esc(t.id)}" data-act="submit">${ms.s?'✓ 已提交辅导员':'提交辅导员'}</button>`:''}
      ${ms.p!=='todo'?`<button class="pbtn undo" data-tid="${esc(t.id)}" data-act="reset">撤销</button>`:''}
    </div>`:'<div class="viewonly">这项任务不归你负责，只能查看。</div>'}`;
  $$('#dbox .pbtn[data-tid]').forEach(el=>{
    el.addEventListener('click',e=>{
      e.preventDefault();e.stopPropagation();
      try{
        const tid=el.dataset.tid,act=el.dataset.act;
        const ms2=myState(tid);
        if(act==='start'){setMyState(tid,'doing');toast('▶ 已开始做','var(--blue)');}
        else if(act==='finish'){setMyState(tid,'done');toast('✓ 已标记完成','var(--ok)');}
        else if(act==='submit'){setMyState(tid,undefined,!ms2.s);toast(ms2.s?'已取消提交':'✓ 已提交辅导员',ms2.s?'#888':'var(--yellow)');}
        else if(act==='reset'){setMyState(tid,'todo',false);toast('已撤销','#888');}
        closeDetail();
        setTimeout(()=>{
          const active=$('.seg button.on');if(active)show(active.dataset.view);
        },400);
      }catch(err){
        console.error('[KANBAN] detail error',err);
        toast('操作失败: '+err.message,'var(--err)');
      }
    });
  });
  $('#detail').classList.add('on');
}
function closeDetail(){$('#detail').classList.remove('on');}
$('#detail').onclick=e=>{if(e.target.id==='detail')closeDetail();};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDetail();});
</script>
