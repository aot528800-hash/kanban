<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>班委工作看板</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#0058A3; --blue-d:#003E70; --blue-l:#E8F0FA;
  --yellow:#FFDB00; --yellow-d:#E5C500;
  --bg:#F5F5F0; --surface:#fff; --text:#111; --text2:#484848; --text3:#767676;
  --border:#DFDFDF; --border-l:#EDEDED;
  --ok:#0A8A00; --ok-bg:#E8F5E8;
  --warn:#E86A00; --warn-bg:#FFF3E6;
  --err:#E00751; --err-bg:#FDE8EE;
  --r:12px; --shadow:0 1px 3px rgba(0,0,0,.08),0 4px 12px rgba(0,0,0,.05);
}
html,body{background:var(--bg);color:var(--text);font-size:15px;line-height:1.55;
  font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
h1,h2,h3{font-weight:700;letter-spacing:-.01em}
input,select,textarea{font:inherit}

/* ===== Gate ===== */
#gate{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  background:var(--blue)}
.gate-box{width:380px;background:#fff;border-radius:20px;padding:40px 36px;text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.2)}
.gate-logo{width:64px;height:64px;margin:0 auto 20px;border-radius:18px;background:var(--yellow);
  display:flex;align-items:center;justify-content:center}
.gate-logo svg{width:32px;height:32px;fill:var(--blue)}
.gate-box h1{font-size:24px;margin-bottom:6px}
.gate-box p{color:var(--text3);font-size:14px;margin-bottom:24px}
.gate-box input{width:100%;padding:14px 18px;border-radius:12px;border:2px solid var(--border);
  font-size:17px;text-align:center;letter-spacing:3px;outline:none;transition:.2s}
.gate-box input:focus{border-color:var(--blue)}
.gate-box .btn-main{width:100%;margin-top:16px;padding:14px;border-radius:12px;
  background:var(--blue);color:#fff;font-size:17px;font-weight:700;transition:.15s}
.gate-box .btn-main:hover{background:var(--blue-d)}
.gate-box .btn-main:active{transform:scale(.98)}
.gate-err{color:var(--err);font-size:13px;margin-top:12px;min-height:20px}

/* ===== Header ===== */
header{position:sticky;top:0;z-index:30;height:60px;display:flex;align-items:center;gap:16px;
  padding:0 28px;background:var(--surface);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700;white-space:nowrap}
.brand-icon{width:32px;height:32px;border-radius:10px;background:var(--yellow);
  display:flex;align-items:center;justify-content:center}
.brand-icon svg{width:18px;height:18px;fill:var(--blue)}
.seg{display:flex;gap:4px;background:#F0F0EC;padding:4px;border-radius:12px}
.seg button{padding:8px 20px;border-radius:9px;font-size:14px;font-weight:600;color:var(--text2);transition:.15s}
.seg button:hover{background:#E8E8E2}
.seg button.on{background:var(--blue);color:#fff}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.who{font-size:13px;color:var(--text2);display:flex;align-items:center;gap:8px}
.who b{color:var(--text)}
.btn-sm{padding:8px 16px;border-radius:9px;font-size:13px;font-weight:600;transition:.15s}
.btn-sm.outline{border:2px solid var(--border);color:var(--text2)}
.btn-sm.outline:hover{border-color:var(--blue);color:var(--blue)}
.btn-sm.filled{background:var(--blue);color:#fff}
.btn-sm.filled:hover{background:var(--blue-d)}
.btn-sm.yellow{background:var(--yellow);color:var(--blue)}
.btn-sm.yellow:hover{background:var(--yellow-d)}

/* ===== Layout ===== */
main{max-width:1440px;margin:0 auto;padding:28px 32px 80px}
@media(max-width:800px){main{padding:20px 16px 60px}}
.page-head{margin-bottom:24px}
.page-head h1{font-size:32px;margin-bottom:4px}
.page-head p{color:var(--text3);font-size:14px}
.card{background:var(--surface);border-radius:var(--r);padding:24px;box-shadow:var(--shadow)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1000px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.g2,.g3,.g4{grid-template-columns:1fr}}

/* ===== Stats ===== */
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
@media(max-width:700px){.stat-row{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--surface);border-radius:var(--r);padding:18px 22px;box-shadow:var(--shadow)}
.stat .k{font-size:13px;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.stat .v{font-size:36px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
.stat .v.blue{color:var(--blue)} .stat .v.green{color:var(--ok)} .stat .v.orange{color:var(--warn)}

/* ===== Task Card ===== */
.task{background:var(--surface);border-radius:var(--r);padding:20px 22px;box-shadow:var(--shadow);
  margin-bottom:14px;border-left:5px solid var(--border);transition:.15s}
.task:hover{box-shadow:0 4px 16px rgba(0,0,0,.1)}
.task.p-高{border-left-color:var(--err)}
.task.p-中{border-left-color:var(--warn)}
.task.p-低{border-left-color:var(--ok)}
.task.st-done{opacity:.6;border-left-color:var(--ok)}
.task h3{font-size:17px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.task .meta{display:flex;flex-wrap:wrap;gap:10px;font-size:13px;color:var(--text3);align-items:center}
.task .meta b{color:var(--text2)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;
  padding:3px 10px;border-radius:20px;white-space:nowrap}
.pill.blue{background:var(--blue-l);color:var(--blue)}
.pill.yellow{background:#FFF8DC;color:#8B7500}
.pill.green{background:var(--ok-bg);color:var(--ok)}
.pill.orange{background:var(--warn-bg);color:var(--warn)}
.pill.red{background:var(--err-bg);color:var(--err)}
.pill.gray{background:#F0F0EC;color:var(--text3)}
.due-soon{color:var(--err);font-weight:700}

/* ===== Progress Controls ===== */
.progress-bar{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;align-items:center}
.pbtn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:10px;
  font-size:14px;font-weight:600;transition:.15s;border:2px solid transparent}
.pbtn:hover{transform:translateY(-1px)}
.pbtn:active{transform:scale(.97)}
.pbtn.todo{background:#F0F0EC;color:var(--text2)}
.pbtn.todo:hover{background:#E8E8E2}
.pbtn.doing{background:var(--blue);color:#fff}
.pbtn.done{background:var(--ok);color:#fff}
.pbtn.submit{background:var(--yellow);color:var(--blue)}
.pbtn.undo{background:none;color:var(--text3);border-color:var(--border);padding:9px 14px}
.pbtn.undo:hover{border-color:var(--err);color:var(--err)}
.pbtn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.progress-info{margin-top:10px;font-size:13px;color:var(--text3);display:flex;align-items:center;gap:6px}
.progress-info .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.progress-info .dot.doing{background:var(--blue)}
.progress-info .dot.done{background:var(--ok)}
.progress-info .dot.sub{background:var(--yellow)}

/* ===== Kanban ===== */
.kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:900px){.kanban{grid-template-columns:1fr}}
.kcol{background:#EDEDE8;border-radius:16px;padding:16px;min-height:200px}
.kcol h3{font-size:15px;margin-bottom:12px;padding:0 4px;display:flex;justify-content:space-between;align-items:center}
.kcol h3 .count{background:var(--surface);padding:2px 10px;border-radius:12px;font-size:13px;font-weight:700}
.kcol .task{margin-bottom:12px}

/* ===== Calendar ===== */
.cal{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:32px;overflow-x:auto}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.cal-head h2{font-size:28px}
.cal-nav{display:flex;gap:10px}
.cal-nav button{width:48px;height:48px;border-radius:14px;background:#F0F0EC;font-size:24px;
  display:flex;align-items:center;justify-content:center;transition:.15s}
.cal-nav button:hover{background:var(--blue);color:#fff}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(120px,1fr));gap:8px;min-width:900px}
.cal-dow{text-align:center;font-size:15px;font-weight:700;color:var(--text3);padding:12px 0}
.cal-day{min-height:130px;border-radius:14px;padding:10px 12px;background:#FAFAF6;
  border:2px solid transparent;cursor:pointer;transition:.15s}
.cal-day:hover{border-color:var(--blue);transform:translateY(-1px)}
.cal-day.out{opacity:.25;cursor:default}
.cal-day.out:hover{border-color:transparent;transform:none}
.cal-day.today{background:var(--blue-l);border-color:var(--blue);box-shadow:0 4px 16px rgba(0,88,163,.15)}
.cal-day .dn{font-size:16px;color:var(--text3);font-weight:700;margin-bottom:8px}
.cal-day .dn.today-num{color:var(--blue);font-weight:900;font-size:20px}
.cal-bar{font-size:12.5px;font-weight:600;padding:5px 10px;margin-bottom:4px;
  color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;
  transition:.12s}
.cal-bar:hover{opacity:.85;transform:scale(1.02)}
.cal-bar.p-高{background:var(--err)} .cal-bar.p-中{background:var(--warn)} .cal-bar.p-低{background:var(--ok)}
.cal-bar.s-start{border-radius:8px 0 0 8px}
.cal-bar.s-mid{border-radius:0}
.cal-bar.s-end{border-radius:0 8px 8px 0}
.cal-bar.s-single{border-radius:8px}

/* ===== Detail Modal ===== */
#detail{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:20px}
#detail.on{display:flex}
.dbox{background:#fff;border-radius:20px;width:min(600px,95vw);max-height:85vh;overflow:auto;padding:32px}
.dbox h2{font-size:22px;margin-bottom:16px}
.dclose{float:right;width:36px;height:36px;border-radius:10px;background:#F0F0EC;
  display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--text3)}
.dclose:hover{background:var(--err-bg);color:var(--err)}
.dfield{margin:14px 0}
.dfield .dk{font-size:12px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.dfield .dv{font-size:15px;line-height:1.7;white-space:pre-wrap}
.viewonly{margin-top:16px;padding:12px 16px;background:#F0F0EC;border-radius:10px;
  font-size:13px;color:var(--text3);text-align:center}

/* ===== Empty ===== */
.empty{color:var(--text3);text-align:center;padding:40px;font-size:14px}

/* ===== Print ===== */
.print-bar{display:none}
@media print{
  header,.seg,.hdr-right,.progress-bar,.pbtn,.cal-nav,.dclose,.print-bar,#gate,#detail{display:none!important}
  body{background:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  main{max-width:none;padding:0}
  .card,.task,.stat,.cal,.kcol{box-shadow:none!important;border:1px solid #ccc!important;break-inside:avoid}
  .task{margin-bottom:8px;padding:12px 16px}
  .page-head h1{font-size:20px}
  .stat .v{font-size:24px}
  .kanban{gap:8px}
  .cal-day{min-height:50px}
}
</style>
</head>

<div id="gate">
  <div class="gate-box">
    <div class="gate-logo"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/></svg></div>

    <p>输入你的专属密码</p>

      <div class="who"><span id="who-txt"></span></div>
      <button class="btn-sm outline" id="btn-out">退出</button>
    </div>
  </header>
  <main>
    <section id="v-mine"></section>
    <section id="v-all" hidden></section>
    <section id="v-cal" hidden></section>
  </main>
</div>

<script>
"use strict";
let DATA=null,ME=null,SHARED={};
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const today=()=>{const d=new Date();return`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;};
const pad=n=>String(n).padStart(2,'0');
const daysLeft=d=>{if(!d)return null;const a=new Date(d+'T00:00:00'),b=new Date(today()+'T00:00:00');return Math.round((a-b)/86400000);};
const dateRange=(s,e)=>{
  const raw=s||e; if(!raw)return[];
  const a=new Date((s||e)+'T00:00:00'), b=new Date((e||s)+'T00:00:00');
  if(isNaN(a)||isNaN(b))return[raw];
  if(a>b)return[s||e];
  const out=[]; for(let d=new Date(a);d<=b;d.setDate(d.getDate()+1))
    out.push(`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`);
  return out;
};

/* ===== Toast ===== */
function toast(msg,color){
  let el=document.getElementById('toast');
  if(!el){
    el=document.createElement('div');el.id='toast';
    el.style.cssText='position:fixed;bottom:40px;left:50%;transform:translateX(-50%);z-index:999;'+
      'padding:16px 32px;border-radius:16px;font-size:17px;font-weight:700;'+
      'box-shadow:0 12px 40px rgba(0,0,0,.25);transition:.3s;opacity:0;pointer-events:none;'+
      'color:#fff;background:'+(color||'#111');
    document.body.appendChild(el);
  }
  el.style.background=color||'#111';
  el.textContent=msg;el.style.opacity='1';el.style.transform='translateX(-50%) scale(1)';
  clearTimeout(el._t);el._t=setTimeout(()=>{el.style.opacity='0';},2500);
  console.log('[KANBAN]',msg);
}

/* ===== 解密 ===== */
async function unlock(pwd){
  const enc=new TextEncoder(),B=window.__BLOB__;
  const km=await crypto.subtle.importKey('raw',enc.encode(pwd),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64d(B.salt),iterations:B.iter,hash:'SHA-256'},
    km,{name:'AES-GCM',length:256},false,['decrypt']);
  for(const s of B.slots){
    try{
      const rawK=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(s.iv)},key,b64d(s.ct));
      const k=await crypto.subtle.importKey('raw',rawK,'AES-GCM',false,['decrypt']);
      const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(B.iv)},k,b64d(B.ct));
      let tok=null;
      if(B.tokCt){try{const tp=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(B.tokIv)},k,b64d(B.tokCt));tok=JSON.parse(new TextDecoder().decode(tp)).token;}catch(e){}}
      return{me:s.id,data:JSON.parse(new TextDecoder().decode(pt)),token:tok,repo:B.repo};
    }catch(e){}
  }
  throw new Error('bad');
}

/* ===== 共享状态 ===== */
async function loadShared(){
  try{
    const r=await fetch('https://raw.githubusercontent.com/aot528800-hash/kanban/main/state.json?t='+Date.now());
    if(r.ok)SHARED=await r.json();else SHARED={};
  }catch(e){SHARED={};}
  // 清洗脏数据：把字符串等非对象值替换为标准格式
  for(const pid of Object.keys(SHARED)){
    if(typeof SHARED[pid]!=='object'||SHARED[pid]===null){SHARED[pid]={};continue;}
    for(const tid of Object.keys(SHARED[pid])){
      const v=SHARED[pid][tid];
      if(typeof v==='string'){
        SHARED[pid][tid]={p:v==='done'?'done':v==='doing'?'doing':'todo',s:v==='submitted'};
      }else if(!v||typeof v!=='object'){
        SHARED[pid][tid]={p:'todo',s:false};
      }else{
        if(!v.p||typeof v.p!=='string')v.p='todo';
        v.s=!!v.s;
      }
    }
  }
  console.log('[KANBAN] shared state loaded, cleaned');
}
async function saveShared(){
  if(!window.__TOKEN__)return false;
  try{
    const content=btoa(unescape(encodeURIComponent(JSON.stringify(SHARED))));
    let sha=null;
    try{const r=await fetch('https://api.github.com/repos/'+window.__REPO__+'/contents/state.json',{headers:{Authorization:'token '+window.__TOKEN__}});
      if(r.ok)sha=(await r.json()).sha;}catch(e){}
    const body={message:'update',content};if(sha)body.sha=sha;
    const r2=await fetch('https://api.github.com/repos/'+window.__REPO__+'/contents/state.json',{
      method:'PUT',headers:{Authorization:'token '+window.__TOKEN__,'Content-Type':'application/json'},body:JSON.stringify(body)});
    return r2.ok;
  }catch(e){return false;}
}
function myState(tid){
  const s=SHARED[ME]||{};
  const st=s[tid];
  if(!st||typeof st!=='object')return{p:'todo',s:false};
  return{p:st.p||'todo',s:!!st.s};
}
function setMyState(tid,progress,submitted){
  if(!ME){console.error('[KANBAN] ME is null');return;}
  if(!SHARED[ME])SHARED[ME]={};
  let cur=SHARED[ME][tid];
  if(!cur||typeof cur!=='object')cur={p:'todo',s:false};
  if(progress!==undefined)cur.p=progress;
  if(submitted!==undefined)cur.s=submitted;
  SHARED[ME][tid]=cur;
  console.log('[KANBAN] state updated',ME,tid,JSON.stringify(cur));
  saveShared();
}
function sharedStats(tid,task){
  const assigned=(DATA.people||[]).filter(p=>{
    if(!task||!task.roles)return true;
    return task.roles.includes('全体')||task.roles.includes(p.role);
  });
  const ids=new Set(assigned.map(p=>p.id));
  const entries=Object.entries(SHARED).filter(([id])=>ids.has(id)&&typeof SHARED[id]==='object');
  const done=entries.filter(([,p])=>{const st=p[tid];return st&&typeof st==='object'&&st.p==='done';}).length;
  const doing=entries.filter(([,p])=>{const st=p[tid];return st&&typeof st==='object'&&st.p==='doing';}).length;
  return{done,doing,total:assigned.length};
}

/* ===== 工具 ===== */
function personOf(id){return(DATA.people||[]).find(p=>p.id===id);}
function myRole(){const p=personOf(ME);return p?p.role:'';}
function roleLabel(t){
  if(t.roles.includes('全体'))return'全体班委';
  return t.roles.map(r=>{
    const same=(DATA.people||[]).filter(p=>p.role===r);
    const names=same.filter(p=>p.name).map(p=>p.name);
    return names.length?`${r}（${names.join('、')}）`:r;
  }).join('、');
}
function isMine(t){if(t.roles.includes('全体'))return true;return t.roles.includes(myRole());}

/* ===== 路由 ===== */
function show(v){
  ['mine','all','cal'].forEach(x=>{const el=$('#v-'+x);if(el)el.hidden=x!==v;});
  $$('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.view===v));
  if(v==='mine')renderMine();
  if(v==='all')renderAll();
  if(v==='cal')renderCal();
  window.scrollTo(0,0);
}
$$('.seg button').forEach(b=>b.onclick=()=>show(b.dataset.view));
$('#btn-print').onclick=()=>window.print();
$('#btn-out').onclick=()=>location.reload();

$('#btn-unlock').onclick=async()=>{
  const pwd=$('#pwd').value.trim();
  if(!pwd){$('#gate-err').textContent='请输入密码';return;}
  $('#gate-err').textContent='';$('#btn-unlock').textContent='登录中…';
  try{
    const r=await unlock(pwd);
    ME=r.me;DATA=r.data;window.__TOKEN__=r.token;window.__REPO__=r.repo||'aot528800-hash/kanban';
    await loadShared();
    $('#gate').style.display='none';$('#app').hidden=false;
    const p=personOf(ME);
    $('#who-txt').innerHTML=p?`<b>${esc(p.name||p.role)}</b> ${esc(p.class)}·${esc(p.role)}`:esc(ME);
    show('mine');
  }catch(e){$('#gate-err').textContent='密码不正确';$('#btn-unlock').textContent='登录';}
};
$('#pwd').addEventListener('keydown',e=>{if(e.key==='Enter')$('#btn-unlock').click();});

/* ===== 我的任务 ===== */
function renderMine(){
  const all=DATA.tasks;
  const mine=all.filter(isMine);
  const todo=mine.filter(t=>myState(t.id).p==='todo');
  const doing=mine.filter(t=>myState(t.id).p==='doing');
  const done=mine.filter(t=>myState(t.id).p==='done');
  const submitted=mine.filter(t=>myState(t.id).s);

  $('#v-mine').innerHTML=`
    <div class="page-head"><h1>我的任务</h1>
      <p>更新于 ${esc(DATA.updated)} · 岗位「${esc(myRole())}」 · 共 ${mine.length} 项</p></div>
    <div class="stat-row">
      <div class="stat"><div class="k">待办</div><div class="v">${todo.length}</div></div>
      <div class="stat"><div class="k">进行中</div><div class="v blue">${doing.length}</div></div>
      <div class="stat"><div class="k">已完成</div><div class="v green">${done.length}</div></div>
      <div class="stat"><div class="k">已提交辅导员</div><div class="v orange">${submitted.length}</div></div>
    </div>
    ${mine.length?mine.map(t=>taskCard(t,true)).join(''):'<div class="card"><div class="empty">暂时没有分配给你岗位的任务</div></div>'}`;
  bindCards();
}

function taskCard(t,showCtrl){
  const ms=myState(t.id);
  const sc=sharedStats(t.id,t);
  const d=daysLeft(t.due);
  const isDone=ms.p==='done';
  let dueH=t.due?esc(t.due):'未设';
  if(!isDone&&d!==null){
    if(d<0)dueH=`<span class="due-soon">已逾期 ${-d} 天</span>`;
    else if(d===0)dueH='<span class="due-soon">今天截止</span>';
    else if(d<=3)dueH=`<span class="due-soon">${dueH}（还剩 ${d} 天）</span>`;
  }
  const progressLabel=ms.p==='doing'?'<span class="pill blue">进行中</span>':ms.p==='done'?'<span class="pill green">已完成</span>':'<span class="pill gray">待办</span>';
  return`<div class="task p-${esc(t.priority||'低')} ${isDone?'st-done':''}" data-id="${esc(t.id)}">
    <h3>${esc(t.title)}</h3>
    <div class="meta">
      <span class="pill ${t.priority==='高'?'red':t.priority==='中'?'orange':'green'}">${esc(t.priority||'低')}</span>
      <span class="pill blue">${esc(t.dept||'—')}</span>
      ${progressLabel}
      ${t.needs_submit?'<span class="pill yellow">需提交辅导员</span>':''}
      <span>截止：${dueH}</span>
      <span>负责：${esc(roleLabel(t))}</span>
    </div>
    ${sc.done+sc.doing>0?`<div class="progress-info">
      ${sc.doing?`<span class="dot doing"></span>${sc.doing} 人进行中`:''}
      ${sc.done?`<span class="dot done"></span>${sc.done}/${sc.total} 人已完成`:''}
    </div>`:''}
    ${showCtrl?`<div class="progress-bar">
      ${ms.p==='todo'?`<button class="pbtn doing" data-tid="${esc(t.id)}" data-act="start">▶ 开始做</button>`:''}
      ${ms.p==='doing'?`<button class="pbtn done" data-tid="${esc(t.id)}" data-act="finish">✓ 完成了</button>`:''}
      ${ms.p==='done'?`<button class="pbtn done" disabled>✓ 已完成</button>`:''}
      ${t.needs_submit?`<button class="pbtn submit ${ms.s?'done':''}" data-tid="${esc(t.id)}" data-act="submit">${ms.s?'✓ 已提交辅导员':'提交辅导员'}</button>`:''}
      ${ms.p!=='todo'?`<button class="pbtn undo" data-tid="${esc(t.id)}" data-act="reset">撤销</button>`:''}
    </div>`:''}
  </div>`;
}

function bindCards(){
  $$('.task[data-id]').forEach(el=>{
    el.addEventListener('click',e=>{
      if(e.target.closest('.pbtn'))return;
      openDetail(el.dataset.id);
    });
  });
  $$('.pbtn[data-tid]').forEach(el=>{
    el.addEventListener('click',e=>{
      e.preventDefault();
      e.stopPropagation();
      try{
        const tid=el.dataset.tid,act=el.dataset.act;
        const ms=myState(tid);
        console.log('[KANBAN] click',act,'task',tid,'current',JSON.stringify(ms));
        if(act==='start'){
          setMyState(tid,'doing');
          el.textContent='✓ 完成了';
          el.className='pbtn done';
          toast('▶ 已开始做','var(--blue)');
        }else if(act==='finish'){
          setMyState(tid,'done');
          el.textContent='✓ 已完成';
          el.className='pbtn done';
          el.disabled=true;
          toast('✓ 已标记完成','var(--ok)');
        }else if(act==='submit'){
          setMyState(tid,undefined,!ms.s);
          el.textContent=ms.s?'提交辅导员':'✓ 已提交辅导员';
          el.className='pbtn submit '+(ms.s?'':'done');
          toast(ms.s?'已取消提交':'✓ 已提交辅导员',ms.s?'#888':'var(--yellow)');
        }else if(act==='reset'){
          setMyState(tid,'todo',false);
          toast('已撤销','#888');
        }
        setTimeout(()=>{
          const active=$('.seg button.on');
          if(active)show(active.dataset.view);
        },600);
      }catch(err){
        console.error('[KANBAN] error',err);
        toast('操作失败: '+err.message,'var(--err)');
      }
    });
  });
}

/* ===== 全部任务 ===== */
function renderAll(){
  const cols=['待办','进行中','已完成'].map(st=>{
    const list=DATA.tasks.filter(t=>{
      const mp=myState(t.id).p;
      if(st==='已完成')return mp==='done';
      if(st==='进行中')return mp==='doing';
      return mp==='todo';
    });
    return`<div class="kcol"><h3>${st}<span class="count">${list.length}</span></h3>
      ${list.map(t=>taskCard(t,isMine(t))).join('')||'<div class="empty">无</div>'}</div>`;
  }).join('');
  $('#v-all').innerHTML=`<div class="page-head"><h1>全部任务</h1>
    <p>共 ${DATA.tasks.length} 项 · 按我的进度分列 · 所有班委可见</p></div>
    <div class="kanban">${cols}</div>`;
  bindCards();
}

/* ===== 日历（多天支持） ===== */
let CY=new Date().getFullYear(),CM=new Date().getMonth();
function renderCal(){
  const first=new Date(CY,CM,1);
  const startDow=(first.getDay()+6)%7;
  const daysIn=new Date(CY,CM+1,0).getDate();
  const cells=[];
  for(let i=0;i<startDow;i++)cells.push(null);
  for(let d=1;d<=daysIn;d++)cells.push(d);

  // 任务按日期展开
  const byDay={};
  DATA.tasks.forEach(t=>{
    const dates=dateRange(t.start,t.due);
    dates.forEach((dt,i)=>{
      if(!byDay[dt])byDay[dt]=[];
      const cls=i===0&&dates.length>1?'s-start':i===dates.length-1&&dates.length>1?'s-end':dates.length>1?'s-mid':'s-single';
      byDay[dt].push({t,span:cls});
    });
  });

  const html=cells.map(d=>{
    if(!d)return'<div class="cal-day out"></div>';
    const key=`${CY}-${pad(CM+1)}-${pad(d)}`;
    const list=byDay[key]||[];
    const isToday=key===today();
    return`<div class="cal-day ${isToday?'today':''}" data-day="${key}">
      <div class="dn ${isToday?'today-num':''}">${d}</div>
      ${list.slice(0,3).map(x=>`<div class="cal-bar p-${esc(x.t.priority||'低')} ${x.span}" data-tid="${esc(x.t.id)}">${esc(x.t.title)}</div>`).join('')}
      ${list.length>3?`<div class="dn">+${list.length-3} 项</div>`:''}
    </div>`;
  }).join('');

  $('#v-cal').innerHTML=`
    <div class="page-head"><h1>日历</h1><p>按时间查看 · 多天任务显示为横条 · 点某天看当天任务</p></div>
    <div class="cal">
      <div class="cal-head"><h2>${CY} 年 ${CM+1} 月</h2>
        <div class="cal-nav"><button id="cal-prev">‹</button><button id="cal-next">›</button></div></div>
      <div class="cal-grid">${['一','二','三','四','五','六','日'].map(x=>`<div class="cal-dow">${x}</div>`).join('')}${html}</div>
    </div>`;
  $('#cal-prev').onclick=()=>{CM--;if(CM<0){CM=11;CY--;}renderCal();};
  $('#cal-next').onclick=()=>{CM++;if(CM>11){CM=0;CY++;}renderCal();};
  $$('.cal-day[data-day]').forEach(el=>el.onclick=e=>{
    if(e.target.classList.contains('cal-bar')){openDetail(e.target.dataset.tid);return;}
    openDay(el.dataset.day);
  });
  $$('.cal-bar[data-tid]').forEach(el=>el.onclick=e=>{e.stopPropagation();openDetail(el.dataset.tid);});
}

function openDay(key){
  const list=DATA.tasks.filter(t=>{
    const dates=dateRange(t.start,t.due);
    return dates.includes(key);
  });
  $('#dbox').innerHTML=`<button class="dclose" onclick="closeDetail()">×</button>
    <h2>${esc(key)}</h2>
    ${list.length?list.map(t=>{
      const ms=myState(t.id);
      const pl=ms.p==='doing'?'进行中':ms.p==='done'?'已完成':'待办';
      return`<div style="margin:12px 0;padding:16px;background:#FAFAF6;border-radius:12px">
      <div style="font-weight:700;margin-bottom:6px">${esc(t.title)}</div>
      <div style="font-size:13px;color:var(--text3)">${esc(t.dept)} · ${esc(pl)} · ${esc(roleLabel(t))}</div>
    </div>`;
    }).join(''):'<div class="empty">这一天没有任务</div>'}`;
  $('#detail').classList.add('on');
}

/* ===== 详情 ===== */
function openDetail(id){
  const t=DATA.tasks.find(x=>x.id===id);if(!t)return;
  const ms=myState(t.id),sc=sharedStats(t.id,t),d=daysLeft(t.due);
  const mine=isMine(t);
  const dueNote=(ms.p!=='done'&&d!==null)?(d<0?`（已逾期 ${-d} 天）`:d===0?'（今天截止）':`（还剩 ${d} 天）`):'';
  const progressLabel=ms.p==='doing'?'<span class="pill blue">进行中</span>':ms.p==='done'?'<span class="pill green">已完成</span>':'<span class="pill gray">待办</span>';
  $('#dbox').innerHTML=`
    <button class="dclose" onclick="closeDetail()">×</button>
    <h2>${esc(t.title)}</h2>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">
      <span class="pill ${t.priority==='高'?'red':t.priority==='中'?'orange':'green'}">${esc(t.priority)}</span>
      <span class="pill blue">${esc(t.dept)}</span>
      ${progressLabel}
      ${t.needs_submit?'<span class="pill yellow">需提交辅导员</span>':''}
    </div>
    <div class="dfield"><div class="dk">负责岗位</div><div class="dv">${esc(roleLabel(t))}</div></div>
    <div class="dfield"><div class="dk">时间</div><div class="dv">开始 ${esc(t.start||'—')}　截止 ${esc(t.due||'—')} ${esc(dueNote)}</div></div>
    ${t.detail?`<div class="dfield"><div class="dk">具体要求</div><div class="dv">${esc(t.detail)}</div></div>`:''}
    ${t.deliverable?`<div class="dfield"><div class="dk">需要交什么</div><div class="dv">${esc(t.deliverable)}</div></div>`:''}
    ${t.note?`<div class="dfield"><div class="dk">备注</div><div class="dv">${esc(t.note)}</div></div>`:''}
    ${sc.done+sc.doing>0?`<div class="dfield"><div class="dk">进度</div><div class="dv">
      ${sc.doing?`${sc.doing} 人进行中　`:''}${sc.done}/${sc.total} 人已完成</div></div>`:''}
    ${mine?`<div class="progress-bar" style="margin-top:18px">
      ${ms.p==='todo'?`<button class="pbtn doing" data-tid="${esc(t.id)}" data-act="start">▶ 开始做</button>`:''}
      ${ms.p==='doing'?`<button class="pbtn done" data-tid="${esc(t.id)}" data-act="finish">✓ 完成了</button>`:''}
      ${ms.p==='done'?`<button class="pbtn done" disabled>✓ 已完成</button>`:''}
      ${t.needs_submit?`<button class="pbtn submit ${ms.s?'done':''}" data-tid="${esc(t.id)}" data-act="submit">${ms.s?'✓ 已提交辅导员':'提交辅导员'}</button>`:''}
      ${ms.p!=='todo'?`<button class="pbtn undo" data-tid="${esc(t.id)}" data-act="reset">撤销</button>`:''}
    </div>`:'<div class="viewonly">这项任务不归你负责，只能查看。</div>'}`;
  $$('#dbox .pbtn[data-tid]').forEach(el=>{
    el.addEventListener('click',e=>{
      e.preventDefault();e.stopPropagation();
      try{
        const tid=el.dataset.tid,act=el.dataset.act;
        const ms2=myState(tid);
        if(act==='start'){setMyState(tid,'doing');toast('▶ 已开始做','var(--blue)');}
        else if(act==='finish'){setMyState(tid,'done');toast('✓ 已标记完成','var(--ok)');}
        else if(act==='submit'){setMyState(tid,undefined,!ms2.s);toast(ms2.s?'已取消提交':'✓ 已提交辅导员',ms2.s?'#888':'var(--yellow)');}
        else if(act==='reset'){setMyState(tid,'todo',false);toast('已撤销','#888');}
        closeDetail();
        setTimeout(()=>{
          const active=$('.seg button.on');if(active)show(active.dataset.view);
        },400);
      }catch(err){
        console.error('[KANBAN] detail error',err);
        toast('操作失败: '+err.message,'var(--err)');
      }
    });
  });
  $('#detail').classList.add('on');
}
function closeDetail(){$('#detail').classList.remove('on');}
$('#detail').onclick=e=>{if(e.target.id==='detail')closeDetail();};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDetail();});
</script>
